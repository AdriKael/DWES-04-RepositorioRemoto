services:
  repositorioremoto:
    image: repositorioremoto
    build:
      context: .
      dockerfile: RepositorioRemoto/Dockerfile

  postgres:
    image: postgres:17
    container_name: repositorio-postgres
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7
    container_name: repositorio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  repositorioremoto.test:
    image: repositorioremoto.test
    build:
      context: .
      dockerfile: RepositorioRemoto.Test/Dockerfile

volumes:
  postgres_data:
  redis_data: